
name: Keep Render Service Awake

on:
  schedule:
    - cron: "*/11 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Send request to Render
        run: |
          curl --fail --silent --show-error --max-time 30 \
            "https://mystery-message-cvjw.onrender.com/" \
            -o /dev/null
